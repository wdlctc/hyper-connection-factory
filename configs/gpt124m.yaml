# GPT-2-small scale (124M non-embedding ~85M). 8 GPUs x 32 x 1024 = 262K tokens/step,
# 10K steps = 2.6B tokens (~20 tokens/param).
n_layer: 12
n_head: 12
d_model: 768
data_dir: data/fineweb-edu
seq_len: 1024
batch_size: 32
grad_accum: 1
max_steps: 10000
lr: 1.5e-3
warmup_steps: 500
schedule: wsd
cooldown_frac: 0.2
eval_every: 500
eval_batches: 50
compile: true
out_dir: runs/gpt124m
