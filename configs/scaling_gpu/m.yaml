# GPU scaling ladder, size M: 12L x 768 (85M non-emb, GPT-2 small body), ~20 tokens/param.
n_layer: 12
n_head: 12
d_model: 768
data_dir: data/fineweb-edu
seq_len: 1024
batch_size: 32
grad_accum: 8
max_steps: 6500          # 1.70B tokens
lr: 1.5e-3
warmup_steps: 500
schedule: wsd
cooldown_frac: 0.2
eval_every: 500
eval_batches: 50
compile: true
out_dir: runs/scaling_gpu/m
