# GPU scaling ladder, size S: 12L x 512 (38.5M non-emb), ~20 tokens/param.
# Global batch 262K tokens (32 x 1024 x grad_accum 8 on one GPU, or DDP equivalent).
n_layer: 12
n_head: 8
d_model: 512
data_dir: data/fineweb-edu
seq_len: 1024
batch_size: 32
grad_accum: 8
max_steps: 3000          # 0.79B tokens
lr: 2.0e-3
warmup_steps: 300
schedule: wsd
cooldown_frac: 0.2
eval_every: 250
eval_batches: 50
compile: true
out_dir: runs/scaling_gpu/s
